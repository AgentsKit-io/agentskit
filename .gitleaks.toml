# Minimal gitleaks config: default rules plus a reasoned allowlist.
# Every entry covers a test fixture or documentation sample, never real secrets.
title = "agentskit gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Secret-redaction tests use synthetic tokens and a dummy PEM body to prove they get redacted"
paths = ['''packages/core/tests/security-secrets\.test\.ts''']

[[allowlists]]
description = "Adapter CLI test uses synthetic placeholder keys and the documented AWS example key"
paths = ['''packages/adapters/tests/cli\.test\.ts''']

[[allowlists]]
description = "Documentation sample with a placeholder key (sk-live-abc123)"
paths = ['''apps/docs-next/content/docs/production/security/secrets\.mdx''']

[[allowlists]]
description = "Generated docs search index; it embeds the placeholder samples from the docs (apiKey REDACTED)"
paths = ['''apps/docs-next/lib/ask-index/index\.json''']

[[allowlists]]
description = "Public PostHog project key in .env.example; phc_ keys are write-only client keys shipped to browsers by design"
paths = ['''apps/(docs-next|landing|registry)/\.env\.example''']
condition = "AND"
regexes = ['''phc_[A-Za-z0-9]+''']
