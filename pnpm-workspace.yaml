packages:
  - packages/*
  - apps/*
allowBuilds:
  '@agentskit/doc-bridge@https://codeload.github.com/AgentsKit-io/doc-bridge/tar.gz/12b28cfb0ec4e491e0582d737993353193bea5e3': true
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  esbuild: false
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - workerd
overrides:
  seroval: "1.6.8"
  source-map-js: "1.2.2"
  serialize-javascript: ">=7.0.5 <8"
  # GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8, GHSA-r4gj-5m52-g5wh
  axios: ">=1.20.0 <2"
  fast-xml-builder: ">=1.1.7 <2"
  next: ">=16.3.6 <17"
  postcss: ">=8.5.22 <9"
  shell-quote: "1.11.0"
  esbuild: ">=0.28.1 <1"
  form-data: ">=4.0.6 <5"
  dompurify: "3.4.13"
  brace-expansion: "5.0.9"
  # GHSA advisories for fast-uri <3.1.7 (host confusion, SSRF, authority injection)
  fast-uri: "3.1.8"
  undici: "7.29.1"
  nanoid: "3.3.18"
  'js-yaml@>=4.0.0 <5': "4.3.2"
  'js-yaml@>=5.0.0 <6': "5.2.2"
  'protobufjs@>=7.5.0 <8': "7.6.5"
  'protobufjs@>=8.0.0 <9': "8.6.6"
  sharp: "0.35.5"
  tar: "7.5.21"
  read-yaml-file: "2.1.0"
  adm-zip: "0.6.1"
  browserslist: ">=4.28.7 <5"
  devalue: ">=5.9.3 <6"
  "@grpc/grpc-js": ">=1.14.5 <2"
  # GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq; only less's image-size() reaches it and the repo ships no .less files
  image-size: "2.0.4"
