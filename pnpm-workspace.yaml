packages:
  - packages/*
  - apps/*
allowBuilds:
  better-sqlite3: false
  core-js: false
  core-js-pure: false
  esbuild: false
onlyBuiltDependencies:
  - esbuild
  - workerd
overrides:
  seroval: ">=1.6.11 <2"
  source-map-js: "1.2.2"
  serialize-javascript: ">=7.0.5 <8"
  # GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8, GHSA-r4gj-5m52-g5wh
  axios: ">=1.20.0 <2"
  fast-xml-builder: ">=1.1.7 <2"
  next: ">=16.4.2 <17"
  postcss: ">=8.5.22 <9"
  shell-quote: "1.11.0"
  esbuild: ">=0.28.1 <1"
  form-data: ">=4.0.6 <5"
  dompurify: "3.4.17"
  brace-expansion: ">=5.0.12 <6"
  # GHSA advisories for fast-uri <3.1.7 (host confusion, SSRF, authority injection)
  fast-uri: ">=3.1.9 <4"
  # GHSA-mrwp-f3q8-3g9p
  follow-redirects: ">=1.16.2 <2"
  undici: "7.30.1"
  nanoid: "3.3.18"
  'js-yaml@>=4.0.0 <5': "4.3.2"
  'js-yaml@>=5.0.0 <6': "5.2.2"
  'protobufjs@>=7.5.0 <8': "7.6.5"
  'protobufjs@>=8.0.0 <9': "8.6.6"
  sharp: "0.35.5"
  tar: "7.5.21"
  read-yaml-file: "2.1.0"
  adm-zip: "0.6.1"
  browserslist: ">=4.28.7 <5"
  devalue: ">=5.9.3 <6"
  "@grpc/grpc-js": ">=1.14.5 <2"
  # GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq; only less's image-size() reaches it and the repo ships no .less files
  image-size: "2.0.4"
  # GHSA-mrhx-c7xc-m3w5; @cloudflare/config pins zod 4.4.3 exactly
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  # GHSA-g3hv-75wg-m249 (minimatch), GHSA-3g3m-2fjr-6pw4 (glob), GHSA-px8p-9vwx-vf98 (fflate), GHSA-238p-pmpm-9mq7 (katex)
  "minimatch@<11": ">=11.0.1 <12"
  "glob@>=9.0.0 <14.0.2": ">=14.0.2 <15"
  "fflate@>=0.7.0 <0.7.5": "0.7.5"
  "katex@>=0.11.0 <0.18.2": ">=0.18.2 <0.19"
auditConfig:
  ignoreGhsas:
    # deepmerge mergeObject() prototype poisoning (low). No patched version published (advisory range has no fix).
    # Reached only via @sveltejs/vite-plugin-svelte (build-time, trusted config). Review by 2027-02-03; drop when a fix ships.
    - GHSA-gcqx-w48m-w2h4
