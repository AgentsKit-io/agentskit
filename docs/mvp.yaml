# MVP do agentskit (lista aprovada pelo dono em 01/11/2026): lista curta, só o que os produtos consumidores precisam antes de
# lançar. Não é a lista da 1.0.
# Decisão do dono: as bibliotecas de base não ganham lista 1.0 completa; cada uma lista de 5 a 12 itens.
# Base: o uso real nos produtos consumidores (adapters com OpenRouter/Anthropic/OpenAI, memory/postgres,
# observability com o CostStore em Postgres e em memória, react) e o que eles ainda calculam por conta própria
# (preço por token vindo de variável de ambiente, arredondamento de dinheiro, expiração de reservas, utilização da
# janela, contagem de usos por tipo).
# Fora da lista (um por linha):
#   - canais de conversa (WhatsApp, Telegram, Slack, e-mail) e agentes prontos (#1916, #1917);
#   - interop: suítes de conformidade, fixtures portáveis, matriz de compatibilidade (#1893..#1897, #1890);
#   - superfície suportada vs experimental e promoção a 1.0 (#1918);
#   - TypeScript 7, Vitest 5, Next 16, Tailwind 4 (#1871..#1873, #1888, #1889);
#   - novos descritores de integração (#1885..#1887) e o backend de busca MCP (#1842);
#   - barra de uso no @agentskit/react (#1932): o agentskit-chat já tem a sua.
# Aprovação: approval.digest é o digest desta lista (ak-harness mvp digest / mvp_manifest.py digest); mudou a lista, precisa aprovar de novo.
version: 1
product: agentskit
repo: AgentsKit-io/agentskit
