name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Review new dependencies
    uses: AgentsKit-io/.github/.github/workflows/dependency-review.yml@e921ea2713ddbf08f9fecea651e39a0b163faa6e # main
    with:
      fail-on-severity: high
      deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
    permissions:
      contents: read
      pull-requests: read

  audit:
    name: pnpm audit
    uses: AgentsKit-io/.github/.github/workflows/audit.yml@e921ea2713ddbf08f9fecea651e39a0b163faa6e # main
    with:
      package-manager: pnpm
      working-directories: '["."]'
      audit-level: high
      production-only: true
      use-pnpm-bulk-api: true
    permissions:
      contents: read
