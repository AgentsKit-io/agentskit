name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'apps/docs-next/**'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read
  deployments: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local production site
        run: pnpm --filter @agentskit/docs-next... build

      - name: Start local production site
        id: local
        run: |
          set -eu
          pnpm --filter @agentskit/docs-next exec next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/docs-next.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "url=http://127.0.0.1:3000" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/docs-next.log"
          exit 1

      - name: Select Lighthouse target
        id: target
        env:
          LOCAL_URL: ${{ steps.local.outputs.url }}
        run: echo "url=$LOCAL_URL" >> "$GITHUB_OUTPUT"

      - name: Build Lighthouse URL list
        id: urls
        env:
          BASE: ${{ steps.target.outputs.url }}
        run: |
          set -eu
          paths="/ /docs /docs/get-started/getting-started/quickstart /stack /showcase"
          {
            echo "urls<<EOF"
            for p in $paths; do
              echo "${BASE}${p}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        id: lhci
        with:
          urls: ${{ steps.urls.outputs.urls }}
          configPath: ./apps/docs-next/lighthouserc.cjs
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Validate audited destinations
        id: destinations
        if: always() && steps.target.outputs.url != ''
        env:
          EXPECTED_ORIGIN: ${{ steps.target.outputs.url }}
          LH_MANIFEST: ${{ steps.lhci.outputs.manifest }}
        run: node scripts/validate-lighthouse-manifest.mjs

      - name: Post Lighthouse summary
        if: always() && steps.target.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LH_MANIFEST: ${{ steps.lhci.outputs.manifest }}
          VALIDATION_OUTCOME: ${{ steps.destinations.outcome }}
        with:
          script: |
            const manifest = process.env.LH_MANIFEST
            if (process.env.VALIDATION_OUTCOME !== 'success') {
              const body = [
                '## Lighthouse',
                '',
                manifest
                  ? 'Audit rejected: the collected page did not remain on the selected Lighthouse target origin.'
                  : 'Audit rejected: Lighthouse did not produce a report manifest.',
                'Check the local production build, then rerun this workflow.',
              ].join('\n')
              const prNumber = context.payload.pull_request?.number
              if (!prNumber) return
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
              return
            }
            let entries
            try {
              entries = JSON.parse(manifest)
            } catch (err) {
              console.log('Could not parse manifest:', err.message)
              return
            }
            const pct = (n) => (typeof n === 'number' ? Math.round(n * 100) : '—')
            const rows = entries.map((e) => {
              const s = e.summary ?? {}
              return `| ${e.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s['best-practices'])} | ${pct(s.seo)} |`
            })
            const body = [
              '## Lighthouse',
              '',
              '| URL | Performance | Accessibility | Best practices | SEO |',
              '|---|---|---|---|---|',
              ...rows,
              '',
              '_Run by `.github/workflows/lighthouse.yml`._',
            ].join('\n')
            const prNumber = context.payload.pull_request?.number
            if (!prNumber) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            })
