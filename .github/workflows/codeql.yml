name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan to catch newly-published rules against unchanged code.
    - cron: '37 3 * * 1'

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    uses: AgentsKit-io/.github/.github/workflows/codeql.yml@1664307a0481656065b2881f42a272efb0d6b32e # main
    with:
      languages: javascript-typescript
      queries: security-and-quality
      build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
