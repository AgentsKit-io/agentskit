name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: pnpm exec commitlint --from="${{ github.event.pull_request.base.sha }}" --to="${{ github.event.pull_request.head.sha }}" --verbose

  changeset-lint:
    name: Changeset lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for changeset
        run: |
          # Skip if PR only touches docs/examples or package metadata.
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          NEEDS_CHANGESET=$(echo "$CHANGED" | grep -E '^packages/' | grep -vE '^packages/[^/]+/(tests?/|.*\.(test|spec)\.[^/]+$|package\.json$|.*\.md$)' || true)

          if [ -z "$NEEDS_CHANGESET" ]; then
            echo "No changes inside packages/ — changeset not required."
            exit 0
          fi

          echo "Package changes detected. Verifying changeset exists..."
          pnpm changeset status --since=origin/main

  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine package task scope
        id: package-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REF" == "changeset-release/main" ]]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -Eq '^(package\.json|pnpm-lock\.yaml|tsconfig[^/]*|vitest\.shared\.ts|turbo\.json|scripts/|\.github/)'; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all packages
        if: steps.package-scope.outputs.run_all == 'true'
        run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2

      - name: Build affected packages and dependents
        if: steps.package-scope.outputs.run_all == 'false'
        run: |
          pnpm exec turbo run build --filter='...[origin/main]' --dry=json > "$RUNNER_TEMP/packed-consumers-build-plan.json"
          pnpm exec turbo run build --filter='...[origin/main]' --concurrency=2

      - name: Publication metadata contract
        run: pnpm check:publication-surface

      - name: Packed consumer publication contract
        env:
          PACKED_CONSUMERS_BUILD_PLAN: ${{ steps.package-scope.outputs.run_all == 'false' && format('{0}/packed-consumers-build-plan.json', runner.temp) || '' }}
        run: pnpm check:packed-consumers

      - name: Published manifest workspace-protocol guard
        run: pnpm check:publish-manifests

      - name: Public API snapshot contract
        run: pnpm check:public-api-snapshot

      - name: Lint all packages
        if: steps.package-scope.outputs.run_all == 'true'
        run: pnpm --filter "./packages/*" lint

      - name: Lint affected packages and dependents
        if: steps.package-scope.outputs.run_all == 'false'
        run: pnpm exec turbo run lint --filter='...[origin/main]'

      # PRs need the current tree's index for documentation gates, but should
      # not carry the repository-wide generated index just to pass CI.
      - name: Generate Doc Bridge artifacts for this checkout
        run: pnpm docs:bridge:index

      - name: Quality gates (errors, exports, any, file-size, parity, docs)
        run: pnpm check:quality-gates

      - name: Verify generated Doc Bridge index freshness
        run: pnpm docs:bridge:freshness

      - name: Doc Bridge gate
        run: pnpm docs:bridge:gate

      - name: Doc Bridge documentation conformance
        run: pnpm docs:bridge:conformance

  tests:
    name: Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine package task scope
        id: package-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REF" == "changeset-release/main" ]]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -Eq '^(package\.json|pnpm-lock\.yaml|tsconfig[^/]*|vitest\.shared\.ts|turbo\.json|scripts/|\.github/)'; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all packages
        if: steps.package-scope.outputs.run_all == 'true'
        run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2

      - name: Build affected packages and dependents
        if: steps.package-scope.outputs.run_all == 'false'
        run: pnpm exec turbo run build --filter='...[origin/main]' --concurrency=2

      # Rollback: restore --concurrency=1 here and in the root package.json.
      - name: Test all packages
        if: steps.package-scope.outputs.run_all == 'true'
        run: pnpm exec turbo run test --concurrency=2

      - name: Test affected packages and dependents
        if: steps.package-scope.outputs.run_all == 'false'
        run: pnpm exec turbo run test --filter='...[origin/main]' --concurrency=2

  quality:
    name: Lint, Test, Build
    needs: [gates, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent jobs to pass
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: test "$GATES_RESULT" = success && test "$TESTS_RESULT" = success

  compatibility:
    name: Compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            experimental: false
          - node: 26
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2

      - run: pnpm check:publication-surface

      - run: pnpm check:packed-consumers

      - run: pnpm check:public-api-snapshot
