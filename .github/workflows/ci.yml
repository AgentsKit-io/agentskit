name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main and scheduled runs always finish.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plan, lint (+ typecheck, commitlint, changeset lint), tests, build and the
  # publication/Doc Bridge gates: see scripts/ci/check.sh and scripts/ci/build.sh.
  pipeline:
    uses: ./.github/workflows/ci-standard.yml
    permissions:
      actions: write
      contents: read

  postgres-memory:
    name: PostgreSQL ChatMemory contract
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: restore
      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: save
      - run: pnpm --filter @agentskit/memory test:postgres
        env:
          AK_POSTGRES_TEST_PORT: 5432
          VITEST_MAX_WORKERS: 2
          TURBO_CONCURRENCY: 2
      - run: pnpm --filter @agentskit/observability test:postgres
        env:
          AK_POSTGRES_TEST_PORT: 5432
          VITEST_MAX_WORKERS: 2
          TURBO_CONCURRENCY: 2
      - name: CostStore contract through CommonJS entry points
        run: pnpm --filter @agentskit/observability test:cjs
        env:
          AK_POSTGRES_TEST_PORT: 5432
          TURBO_CONCURRENCY: 2
      - name: CostStore contract in workerd
        run: pnpm --filter @agentskit/observability test:workerd
        env:
          AK_POSTGRES_TEST_PORT: 5432
          TURBO_CONCURRENCY: 2

  compatibility:
    name: Compatibility (Node ${{ matrix.node }})
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - node: 24
            experimental: false
          - node: 26
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: restore

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: save

      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2

      - run: pnpm check:publication-surface

      - run: pnpm check:packed-consumers

      - run: pnpm check:public-api-snapshot

  # Keeps the required check name: green only when the pipeline and every product job passed.
  quality:
    name: Lint, Test, Build
    needs: [pipeline, postgres-memory, compatibility]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require the pipeline and product jobs to pass
        env:
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
          POSTGRES_RESULT: ${{ needs.postgres-memory.result }}
          COMPAT_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$PIPELINE_RESULT" = success
          # Product jobs are skipped on drafts.
          for r in "$POSTGRES_RESULT" "$COMPAT_RESULT"; do
            test "$r" = success || test "$r" = skipped
          done
