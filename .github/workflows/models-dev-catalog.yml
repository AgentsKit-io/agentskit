name: models.dev catalog freshness

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  freshness:
    name: Compare committed catalog with models.dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Refresh the committed snapshot
        run: pnpm sync:models
      - name: Refresh derived ecosystem evidence
        run: |
          node scripts/gen-ecosystem-stats.mjs
          node scripts/gen-ecosystem-claims.mjs
          node scripts/sync-ecosystem.mjs
      - name: Refresh deterministic docs evidence
        run: |
          pnpm --filter @agentskit/core build
          pnpm --filter @agentskit/docs-next gen:deterministic-knowledge
      - name: Check snapshot freshness and structure
        run: node scripts/check-models-dev-freshness.mjs --max-age-days 35

      - name: Generate release note when the catalog changes
        shell: bash
        run: |
          if git diff --quiet -- \
            packages/adapters/src/catalog/snapshot.json \
            apps/docs-next/lib/ecosystem-stats.snapshot.json \
            apps/landing/lib/ecosystem-stats.snapshot.json \
            ecosystem-claims.json \
            apps/docs-next/lib/ecosystem-claims.snapshot.json \
            apps/landing/lib/ecosystem-claims.snapshot.json; then
            echo "models.dev snapshot is unchanged"
            exit 0
          fi
          cat > .changeset/models-dev-catalog-refresh.md <<'EOF'
          ---
          "@agentskit/adapters": patch
          ---

          Refresh the committed models.dev provider and model catalog.
          EOF

      - name: Open or update the draft refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/models-dev-refresh
          delete-branch: true
          draft: true
          commit-message: "chore(adapters): refresh models.dev catalog"
          title: "chore(adapters): refresh models.dev catalog"
          body: |
            ## Summary

            Automated refresh of the committed models.dev catalog and its derived ecosystem statistics.

            The runtime remains snapshot-only; this PR is reviewable and must pass the normal quality gates before merge.

            ## Source

            - Generated by `scripts/sync-models-dev.mjs`
            - Validated by `scripts/check-models-dev-freshness.mjs`
            - Upstream: https://models.dev

            ## Review checklist

            - [ ] Provider/model diff is expected.
            - [ ] Deprecated or removed models are intentional.
            - [ ] Derived ecosystem counts and claims are synchronized.
          add-paths: |
            .changeset/models-dev-catalog-refresh.md
            packages/adapters/src/catalog/snapshot.json
            apps/docs-next/lib/ecosystem-stats.snapshot.json
            apps/landing/lib/ecosystem-stats.snapshot.json
            ecosystem-claims.json
            apps/docs-next/lib/ecosystem-claims.snapshot.json
            apps/landing/lib/ecosystem-claims.snapshot.json
            apps/docs-next/lib/ecosystem.json
            apps/landing/lib/ecosystem.json
            apps/docs-next/public/ecosystem-bar.js
            apps/docs-next/lib/deterministic-knowledge.generated.json
            apps/docs-next/lib/deterministic-site.generated.json
            apps/docs-next/public/deterministic-knowledge
          labels: roadmap,type-adapter,type-infra,priority-p2
