name: Docs build

# Build-only validation for apps/docs-next (Fumadocs).
# Deployment to Cloudflare happens outside this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs-next/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs-next/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Doc Bridge artifacts for this checkout
        run: pnpm docs:bridge:index

      - run: pnpm --filter "./packages/*" build

      - run: pnpm --filter @agentskit/docs-next build
