name: Ping search engines

# Daily, or on demand, push the live sitemap URLs to IndexNow
# (Bing/Yandex/DuckDuckGo/Ecosia). Google is intentionally not
# pinged: the org blocks service-account keys (iam.disableServiceAccount
# KeyCreation) and Google recrawls the sitemap on its own anyway.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify semantic SEO surfaces
        run: node scripts/check-live-semantic-authority.mjs

      - name: IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node apps/docs-next/scripts/ping-indexnow.mjs
