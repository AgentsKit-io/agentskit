name: Ping search engines

# Once a day (and on manual dispatch), push the live sitemap URLs to
# IndexNow (Bing/Yandex/DuckDuckGo/Ecosia). Google is intentionally not
# pinged: the org blocks service-account keys (iam.disableServiceAccount
# KeyCreation) and Google recrawls the sitemap on its own anyway.
#
# Cloudflare deploys happen outside this repo (docs.yml is build-only), so
# there is no deploy workflow for workflow_run to attach to; use a schedule.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Verify semantic SEO surfaces
        run: node scripts/check-live-semantic-authority.mjs

      - name: IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node apps/docs-next/scripts/ping-indexnow.mjs
