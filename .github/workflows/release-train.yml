name: Release train

# Proposes coordinated dependency updates from release-train.json as a DRAFT PR.
# It never merges and never publishes: a maintainer reviews, merges and releases.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger workflows; an App token makes CI run on the draft PR.
      - name: Create release-train app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # release-train.mjs imports @agentskit/net, whose exports point at the gitignored dist/.
      - run: pnpm exec turbo run build --filter=@agentskit/net...
      - run: node scripts/release-train.mjs --check
      - name: Apply coordinated updates
        id: apply
        run: node scripts/release-train.mjs --apply --body "$RUNNER_TEMP/release-train-body.md"
      - name: Refresh lockfile and generated surfaces
        if: steps.apply.outputs.updated == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          node scripts/check-doc-package-versions.mjs --fix
          pnpm metadata:generate
          pnpm docs:bridge:index
          pnpm readme:standard:refresh -- --preserve-review-dates
      - name: Compatibility and security checks
        if: steps.apply.outputs.updated == 'true'
        run: |
          pnpm check:packed-consumers
          pnpm check:release-train
          pnpm check:minimum-consumers
          pnpm test
          node scripts/audit-prod-high.mjs
      - uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        if: steps.apply.outputs.updated == 'true'
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: release-train/update
          title: 'chore(deps): release-train update'
          body-path: ${{ runner.temp }}/release-train-body.md
          commit-message: 'chore(deps): release-train update'
          draft: true
