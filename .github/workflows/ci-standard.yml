name: CI standard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Standard verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, lint and test affected packages
        run: pnpm exec turbo run build lint test --filter='...[origin/main]' --concurrency=2
      - run: pnpm check:quality-gates
