name: Bundle size

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  size:
    if: github.actor != 'dependabot[bot]'
    name: Check bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: restore

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: save

      - run: pnpm --filter "./packages/*" build

      - run: node scripts/size-core-closure.mjs

      - run: node scripts/gen-size-limit-subpaths.mjs --check

      - run: node scripts/gen-size-limit-subpaths.mjs --build

      - run: pnpm exec size-limit
