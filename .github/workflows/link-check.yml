name: Link check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs-next/content/docs/**'
      - '*.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  push:
    branches: [main]
    paths:
      - 'apps/docs-next/content/docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  lychee:
    name: Lychee
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentskit/docs-next gen:changelog

      - name: Restore lychee cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --no-progress
            --cache
            --max-cache-age 7d
            --accept 200,206,301,302,403,429
            --root-dir ${{ github.workspace }}/apps/docs-next/content
            --fallback-extensions mdx,md
            'apps/docs-next/content/docs/**/*.mdx'
            '*.md'
