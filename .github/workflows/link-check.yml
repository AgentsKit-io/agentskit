name: Link check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs-next/content/docs/**'
      - '*.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  push:
    branches: [main]
    paths:
      - 'apps/docs-next/content/docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lychee:
    if: github.actor != 'dependabot[bot]'
    name: Lychee
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentskit/docs-next gen:changelog

      - name: Restore lychee cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lycheecache
          key: lychee-cache-${{ runner.os }}

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --no-progress
            --cache
            --max-cache-age 7d
            --accept 200,206,301,302,403,429
            --root-dir ${{ github.workspace }}/apps/docs-next/content
            --fallback-extensions mdx,md
            'apps/docs-next/content/docs/**/*.mdx'
            '*.md'
