name: Coverage

# Full-suite coverage runs on main and nightly only. Pull requests already run
# the affected tests in CI / tests, so running the suite again here was a
# duplicate (ticket #1961, option b). On PRs this workflow is a skipped
# placeholder so the required check 'Test coverage' is reported (skipped
# counts as passing). Thresholds are unchanged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: restore

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-cache
        with:
          mode: save

      - run: pnpm exec turbo run build --filter='./packages/*' --concurrency=2

      - run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 7
          if-no-files-found: ignore
