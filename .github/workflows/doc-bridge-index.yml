name: Doc Bridge index refresh

on:
  push:
    branches: [main]
    paths-ignore:
      - '.doc-bridge/index.json'
      - '.doc-bridge/capabilities.json'
      - '.doc-bridge/llms.txt'
      - 'llms.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate current Doc Bridge artifacts
        run: pnpm docs:bridge:index

      - name: Check for index drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- \
            .doc-bridge/index.json \
            .doc-bridge/capabilities.json \
            .doc-bridge/llms.txt \
            llms.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Doc Bridge artifacts are current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Doc Bridge artifacts need an update."
          fi

      - name: Create release automation token
        if: steps.drift.outputs.changed == 'true'
        id: release_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open or update the index refresh PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e
        with:
          token: ${{ steps.release_app_token.outputs.token }}
          branch: automation/doc-bridge-index
          delete-branch: true
          commit-message: "chore(docs): refresh Doc Bridge index"
          title: "chore(docs): refresh Doc Bridge index"
          body: |
            ## What

            Refresh the committed Doc Bridge index and its derived repository indexes.

            ## Why

            The index covers the whole repository and is regenerated on the merged source tree.

            ## Validation

            The PR runs the normal required checks, including the Doc Bridge gates against a newly generated index.
          add-paths: |
            .doc-bridge/index.json
            .doc-bridge/capabilities.json
            .doc-bridge/llms.txt
            llms.txt
