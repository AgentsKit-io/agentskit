name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    if: github.actor != 'dependabot[bot]'
    name: Example apps E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm --filter "./packages/*" build

      - name: Lint every example app
        run: pnpm --filter "./apps/example-*" lint

      - name: Build every example app
        run: pnpm --filter "./apps/example-*" build

      - name: Build the production docs app for docs E2E
        run: pnpm --filter @agentskit/docs-next build
        env:
          NEXT_PUBLIC_ASK_ENDPOINT: https://ask.e2e.invalid/v1/ask

      - name: Build the production Registry app for Registry E2E
        run: pnpm --filter @agentskit/registry-app build
        env:
          NEXT_PUBLIC_ASK_ENDPOINT: https://ask.e2e.invalid/v1/ask

      - run: pnpm exec playwright test

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
