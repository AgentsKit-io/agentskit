name: Citation metadata

on:
  push:
    branches: [main]
    paths:
      - CITATION.cff
      - ecosystem.json
      - packages/core/package.json
      - scripts/generate-software-metadata.mjs
      - scripts/lib/software-metadata.mjs
  pull_request:
    branches: [main]
    paths:
      - CITATION.cff
      - ecosystem.json
      - packages/core/package.json
      - scripts/generate-software-metadata.mjs
      - scripts/lib/software-metadata.mjs

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.actor != 'dependabot[bot]'
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # v2.0.0
        with:
          args: --validate
