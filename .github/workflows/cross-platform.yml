name: Cross-platform

# Runs @agentskit/cross-platform on every OS × runtime it promises (ADR-0036).
# Path-filtered: it only runs when the package, its dependency on core, the
# lockfile, or this workflow changes. Consumers are protected on Linux by the
# `cross-platform guardrail` quality gate instead.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/cross-platform/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cross-platform.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cross-platform/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cross-platform.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: ${{ matrix.os }} · ${{ matrix.runtime }}${{ matrix.version == 'minimum' && ' (minimum)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node, bun, deno]
        version: [latest]
        # The oldest versions the package declares (Node 20.19, Bun 1.1, Deno 2.0),
        # on Linux and on Windows, so the documented floor is tested, not assumed.
        include:
          - { os: ubuntu-latest, runtime: node, version: minimum }
          - { os: windows-latest, runtime: node, version: minimum }
          - { os: ubuntu-latest, runtime: bun, version: minimum }
          - { os: windows-latest, runtime: bun, version: minimum }
          - { os: ubuntu-latest, runtime: deno, version: minimum }
          - { os: windows-latest, runtime: deno, version: minimum }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # Node is needed in every row: pnpm runs on it and the smoke test spawns it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.runtime == 'node' && matrix.version == 'minimum' && '20.19.0' || '22' }}
          cache: pnpm

      # No install scripts: they compile better-sqlite3 (memory/tools), which this
      # package never loads and which fails on windows-latest (node-gyp vs VS 18).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm --filter "@agentskit/cross-platform..." build

      - name: Unit tests
        if: matrix.runtime == 'node'
        run: pnpm --filter @agentskit/cross-platform test

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ matrix.version == 'minimum' && '1.1.0' || '1.x' }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.runtime == 'deno'
        with:
          deno-version: ${{ matrix.version == 'minimum' && 'v2.0.0' || 'v2.x' }}

      - name: Runtime smoke test
        working-directory: packages/cross-platform
        env:
          EXPECT_RUNTIME: ${{ matrix.runtime }}
        run: |
          case "${{ matrix.runtime }}" in
            node) node smoke/smoke.mjs ;;
            bun) bun smoke/smoke.mjs ;;
            deno) deno run -A smoke/smoke.mjs ;;
          esac

      # Windows refuses symlinks to non-admin users without Developer Mode. The
      # runner is admin, so create a plain user and run the fallback check as it.
      - name: Symlink fallback as a non-admin Windows user
        if: runner.os == 'Windows' && matrix.runtime == 'node' && matrix.version == 'latest'
        shell: pwsh
        working-directory: packages/cross-platform
        run: |
          $secret = ConvertTo-SecureString ("Ak!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          New-LocalUser -Name akunpriv -Password $secret -AccountNeverExpires | Out-Null
          $work = Join-Path $env:RUNNER_TEMP 'ak symlink ação'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          icacls $work /grant 'akunpriv:(OI)(CI)F' | Out-Null
          icacls $env:GITHUB_WORKSPACE /grant 'akunpriv:(OI)(CI)RX' | Out-Null
          $cred = [pscredential]::new('akunpriv', $secret)
          $out = Join-Path $env:RUNNER_TEMP 'symlink-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'symlink-err.txt'
          $proc = Start-Process -FilePath (Get-Command node).Source `
            -ArgumentList @('smoke/symlink-unprivileged.mjs', "`"$work`"") `
            -WorkingDirectory (Get-Location).Path -Credential $cred -LoadUserProfile `
            -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru
          Get-Content $out, $err
          exit $proc.ExitCode
